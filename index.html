<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Snake</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="palm palm-left">🌴</div>
    <div class="palm palm-right">🌴</div>
    <div id="game-container">
        <div id="language-selector">
            <select id="lang-select">
                <option value="en">English</option>
                <option value="es">Español</option>
                <option value="it">Italiano</option>
                <option value="ru" selected>Русский</option>
                <option value="uk">Українська</option>
            </select>
        </div>
        <div id="ui-overlay">
            <div id="score">Счет: 0</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        <div id="game-over" style="display: none;">
            <h1 id="game-over-title">ИГРА ОКОНЧЕНА</h1>
            <p id="game-over-text">Змея потерялась в океане!</p>
            <button id="restart-button" onclick="resetGame()">Начать заново</button>
        </div>
    </div>
    <script src="js/translations.js"></script>
    <script src="js/snake.js"></script>
</body>
</html>
